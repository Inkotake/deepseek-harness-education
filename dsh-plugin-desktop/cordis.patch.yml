# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    # One shared teacher-memory service for every preset. It is mounted HERE, on the desktop-owned
    # Host layer, and deliberately not from a bundle or a preset: a preset `isolate` realm would
    # give each preset its own memory, which is the opposite of the design. The name is quoted
    # because a bare leading `@` is a reserved YAML indicator. `build-profile-seed.mjs` links the
    # built runtime into `profiles/desktop/node_modules`, which is what makes this row resolvable.
    - id: global-memory
      name: '@teacher-dsh/global-memory'

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
