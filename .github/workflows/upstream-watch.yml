name: upstream-watch
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream releases
        run: node scripts/teacher/sync-upstream.mjs
      - name: Create PR on change
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'chore(upstream): upstream pins changed'
          branch: 'chore/upstream-sync'