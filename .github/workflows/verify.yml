name: verify
on:
  pull_request:
  push:
    branches: [main, teacher-dsh-0.1]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Desktop upstream checks
        run: |
          corepack enable
          yarn install --immutable
          yarn check
      - name: Teacher distribution checks
        run: node scripts/teacher/verify-distribution.mjs
      - name: Teacher artifact smoke
        run: |
          cd teacher/legacy
          node tests/smoke/run-all.mjs
      - name: PPT smoke
        run: |
          cd teacher/legacy
          node tests/ppt/smoke-ppt.mjs